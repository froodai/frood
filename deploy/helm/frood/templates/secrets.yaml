{{- $fullname := include "frood.fullname" . -}}
{{- if not .Values.moduleTokens.existingSecret }}
{{- $name := include "frood.moduleTokensSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $old := dict -}}
{{- if and $existing $existing.data }}{{ $old = $existing.data }}{{ end }}
# Service tokens between the server and its modules: made once, kept on upgrade and uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "frood.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $module := include "frood.modules" . | fromJsonArray }}
  {{- $key := include "frood.tokenKey" $module }}
  {{ $key }}: {{ get $old $key | default (randAlphaNum 64 | b64enc) }}
  {{- end }}
{{- end }}
{{- if and (not .Values.secrets.existingSecret) .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "frood.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.create }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}

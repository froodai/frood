[package]
name = "frood-notify-openclaw"
description = "Frood module: the Inbox in an OpenClaw conversation, through `openclaw mcp serve`"
version = "0.1.12"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/froodai/frood"
publish = false

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

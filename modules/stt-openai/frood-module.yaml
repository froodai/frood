name: stt-openai
version: 0.0.1
description: Speech to text through OpenAI (gpt-transcribe by default); converts formats OpenAI does not take, such as Telegram's OGG/Opus voice messages.
license: Apache-2.0
provides:
  - media.transcribe@1
frood_api: []
config:
  type: object
  properties:
    model: { type: string, description: "Transcription model, default gpt-transcribe" }
    base_url: { type: string, description: "Another endpoint with the same API" }
permissions:
  egress: [api.openai.com]
  secrets: [OPENAI_API_KEY]
runtime:
  form: container
  health: /healthz

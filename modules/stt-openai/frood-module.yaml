name: stt-openai
version: 0.1.2
description: Speech to text through OpenAI or any server with the same API; converts formats OpenAI does not take, such as Telegram's OGG/Opus voice messages.
license: Apache-2.0
provides:
  - media.transcribe@1
frood_api: []
config:
  type: object
  properties:
    model: { type: string, description: "Transcription model, e.g. gpt-4o-mini-transcribe or gpt-transcribe" }
    base_url: { type: string, description: "Another endpoint with the same API" }
  required: [model]
permissions:
  egress: [api.openai.com]
  secrets: [OPENAI_API_KEY]
runtime:
  form: container
  health: /healthz

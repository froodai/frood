[package]
name = "frood-stt-openai"
description = "Frood module: media.transcribe@1 over OpenAI's speech-to-text API"
version = "0.1.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/froodai/frood"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
tower-service = "0.3"
axum = { version = "0.8", features = ["multipart"] }

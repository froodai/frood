[package]
name = "frood-telegram"
description = "Frood module: a Telegram bot for quick capture (text, voice, files)"
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/froodai/frood"
publish = false

[dependencies]
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

name: telegram
version: 0.1.1
description: Telegram bot for quick capture and the Inbox. Text, voice messages and files go to /v1/capture as the person whose Telegram account is linked (/link <code>); Inbox items arrive as messages with buttons that act as that person. Uses long polling, so no public address is needed.
license: Apache-2.0
provides:
  - notify.send@1
  - notify.update@1
frood_api: [knowledge:capture, knowledge:read, channels:act]
config:
  type: object
  properties:
    language: { type: string, enum: [en, ru], description: "Language of the bot's replies, default en" }
permissions:
  egress: [api.telegram.org]
  secrets: [TELEGRAM_BOT_TOKEN]
runtime:
  form: container
  health: /healthz

name: backup-restic
version: 0.0.1
description: Backups of the installation into restic repositories (a folder, S3, B2, SFTP, REST), with a restore check into a temporary database.
license: Apache-2.0
provides:
  - backup.target@1
frood_api: []
config:
  type: object
  properties: {}
permissions:
  egress: ["the backup targets named in frood.yaml", "the installation's database"]
  secrets: []
runtime:
  form: container
  health: /healthz

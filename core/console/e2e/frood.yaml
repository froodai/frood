# A throwaway installation for developing and testing the console (e2e/serve.sh).
version: 1
installation: { name: console-dev }
server: { listen: "127.0.0.1:${env:FROOD_CONSOLE_PORT:-18080}" }
storage: { uses: postgres, url: "${env:FROOD_CONSOLE_DB}" }
deploy: { server: host }
auth:
  allow: [demo@example.com]
  providers:
    - { kind: dev, id: dev }
# A scheduled job without a model, so Automations has something to show.
jobs:
  digest: { on: [{ schedule: "30 8 * * 1-5", timezone: Europe/Belgrade }] }
# The demo's waiting changes stand for an agent's: the seed writes them as the demo person, so
# a person's change of their own knowledge must wait here too.
policies: { auto_accept_own_changes: false }

# Frood installation config. Design: docs/16_platform.md (§5).
# References: ${secret:NAME} comes from .frood/secrets.env or the environment;
# ${env:NAME:-default} comes from the environment.
version: 1

installation:
  name: __NAME__

server:
  listen: "__LISTEN__"
  # public_url: https://mem.example.com   # needed for cloud clients: Claude, ChatGPT

storage:
  uses: postgres
  url: postgres://frood:${secret:POSTGRES_PASSWORD}@${env:FROOD_DB_HOST:-127.0.0.1}:${env:FROOD_DB_PORT:-__PG_PORT__}/frood
  # Files (photos, videos, voice messages, documents) go to .frood/objects next to this file;
  # backups take them. Or an S3-compatible storage (docs/26 §2):
  # objects: { uses: disk, max_mb: 100 }
  # objects: { uses: s3, endpoint: 'https://s3.eu-central-003.backblazeb2.com', bucket: my-frood,
  #            region: eu-central-003, access_key_id: '${secret:S3_KEY_ID}', secret_access_key: '${secret:S3_SECRET}' }

deploy:
  target: compose
  server: __SERVER__   # container: Frood runs in Docker; host: you run `frood serve` yourself
__IMAGE_OR_BUILD__  postgres_port: __PG_PORT__
  # With server.public_url Frood runs Caddy on 80/443. When the server has its own proxy in front,
  # Frood writes only its routes into that proxy's file instead:
  # proxy: { external: /srv/edge/paths/frood.caddy }

# Spheres of life knowledge is sorted into (docs/26 §3): a label for reading and filters.
# Without this section: tech, business and personal; `spheres: []` turns them off.
# spheres:
#   - id: tech
#   - id: business
#   - id: personal
#   - { id: family, name: Семья, about: "home, children, relatives" }

# Who may sign in, and through which identity providers (docs/12 §3).
auth:
  allow: []                  # exact addresses, e.g. [you@example.com]
  # allow_domains: [example.com]
  providers: []
  #  - kind: oidc            # Google, Microsoft Entra, a corporate SSO
  #    id: google
  #    label: Google
  #    issuer: https://accounts.google.com
  #    client_id: 1234.apps.googleusercontent.com
  #    client_secret: ${secret:GOOGLE_CLIENT_SECRET}
  #  - kind: local           # on this computer: no password, only the addresses in allow
  #    id: local
  #  - kind: telegram        # a "Sign in" button in your linked Telegram; only the addresses in allow
  #    id: telegram
  #  - kind: passkey         # fingerprint or Face ID; the first one through `frood passkey`; needs public_url
  #    id: passkey
  #  - kind: dev             # development only: type an email; local servers only
  #    id: dev

# Backups into two independent storages, with a restore check (docs/16 §7, modules/README.md).
# `frood backup key --out recovery-key.txt` makes the recovery key: keep that file off the server.
# modules:
#   backup: { image: ghcr.io/froodai/backup-restic:__VERSION__, volumes: ["/Volumes/Backup/frood:/repos/disk"] }
# backup:
#   recovery_key: age1…
#   targets:
#     disk: { repository: /repos/disk, password: '${secret:BACKUP_DISK_PASSWORD}' }
#     b2: { repository: 's3:https://s3.eu-central-003.backblazeb2.com/my-bucket', password: '${secret:BACKUP_B2_PASSWORD}',
#           env: { AWS_ACCESS_KEY_ID: '${secret:B2_KEY_ID}', AWS_SECRET_ACCESS_KEY: '${secret:B2_KEY}' } }
#   keep: { daily: 30, monthly: 12 }
# jobs:
#   backup: { on: [{ schedule: '0 */6 * * *', timezone: Europe/Amsterdam }] }
#   backup-verify: { on: [{ schedule: '30 4 * * 0', timezone: Europe/Amsterdam }] }

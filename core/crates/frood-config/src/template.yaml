# Frood installation config. Design: docs/16_platform.md (§5).
# References: ${secret:NAME} comes from .frood/secrets.env or the environment;
# ${env:NAME:-default} comes from the environment.
version: 1

installation:
  name: __NAME__

server:
  listen: "__LISTEN__"
  # public_url: https://mem.example.com   # needed from M2 for OAuth and MCP clients

storage:
  uses: postgres
  url: postgres://frood:${secret:POSTGRES_PASSWORD}@${env:FROOD_DB_HOST:-127.0.0.1}:${env:FROOD_DB_PORT:-__PG_PORT__}/frood

deploy:
  target: compose
  server: __SERVER__   # container: Frood runs in Docker; host: you run `frood serve` yourself
__IMAGE_OR_BUILD__  postgres_port: __PG_PORT__

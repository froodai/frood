[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/froodai/frood"

[workspace.dependencies]
frood-api = { path = "crates/frood-api" }
frood-auth = { path = "crates/frood-auth" }
frood-config = { path = "crates/frood-config" }
frood-dispatch = { path = "crates/frood-dispatch" }
frood-ledger = { path = "crates/frood-ledger" }
frood-llm = { path = "crates/frood-llm" }
frood-mcp = { path = "crates/frood-mcp" }
frood-modhost = { path = "crates/frood-modhost" }
frood-search = { path = "crates/frood-search" }
frood-store = { path = "crates/frood-store" }

age = "0.12"
anyhow = "1"
base64 = "0.23"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
chrono-tz = "0.10"
croner = "4"
getrandom = "0.4"
hex = "0.4"
http = "1"
http-body-util = "0.1"
humantime = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
